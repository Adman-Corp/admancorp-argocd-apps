apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-azure-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Adman-Corp/admancorp-argocd-apps.git
    targetRevision: main
    path: roots/azure-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
